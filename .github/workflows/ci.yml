name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL_ADMIN: postgresql://postgres:postgres@127.0.0.1:5432/whatsapp_ai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7 pinned
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m pip check
      - run: bash -n scripts/*.sh provider/wppconnect/*.sh deploy/local/*.sh
      - run: docker compose --env-file deploy/local/.env.example -f deploy/local/docker-compose.yml config --quiet
      - run: node --check provider/wppconnect/wpp-entrypoint.cjs
      - run: ruff check app scripts tests
      - run: mypy --ignore-missing-imports --check-untyped-defs app scripts
      - run: bandit -q -r app scripts
      - run: python -m compileall -q app scripts
      - run: pytest

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 pinned
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verified Gitleaks tree scan
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          expected='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/gitleaks.tar.gz "$url"
          echo "${expected}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --redact --no-banner --exit-code 1 .

      - name: Build production image
        run: docker build --pull --tag whatsapp-ai:ci .

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 pinned
        with:
          scan-type: image
          image-ref: whatsapp-ai:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table

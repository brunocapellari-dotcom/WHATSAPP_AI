services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: whatsapp_ai
      POSTGRES_USER: whatsapp_ai
      POSTGRES_PASSWORD: local_change_me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_ai -d whatsapp_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:stable
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
    volumes:
      - clamav_data:/var/lib/clamav

  migrate:
    build:
      context: .
      target: deps
    command: ["npm","run","db:migrate"]
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["node","dist/src/worker.js"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  clamav_data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: whatsapp_ai
      POSTGRES_USER: whatsapp_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_ai -d whatsapp_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.2
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.34.2
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-qwen3-vl:4b-instruct}
    entrypoint: ["/bin/sh", "-lc"]
    command: ['ollama pull "$$LOCAL_AI_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  whisper-model:
    build:
      context: .
      dockerfile: docker/whisper/Dockerfile
      args:
        WHISPER_CPP_COMMIT: 927cfce34f31707e17f2bff35c349632fb9e2c3a
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_MODEL_SHA256: ${WHISPER_MODEL_SHA256:-}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        case "$WHISPER_MODEL" in
          small)
            expected_sha=" ${WHISPER_MODEL_SHA256:-1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b}"
            ;;
          *)
            test -n "$WHISPER_MODEL_SHA256" || {
              echo "WHISPER_MODEL_SHA256 is required for model $WHISPER_MODEL" >&2
              exit 1
            }
            expected_sha="$WHISPER_MODEL_SHA256"
            ;;
        esac
        model_path="/models/ggml-$WHISPER_MODEL.bin"
        if test -s "$model_path" && ! printf '%s  %s\n' "$expected_sha" "$model_path" | sha256sum -c -; then
          rm -f "$model_path"
        fi
        test -s "$model_path" || /opt/whisper/models/download-ggml-model.sh "$WHISPER_MODEL" /models
        printf '%s  %s\n' "$expected_sha" "$model_path" | sha256sum -c -
    volumes:
      - whisper_models:/models
    restart: "no"

  whisper:
    build:
      context: .
      dockerfile: docker/whisper/Dockerfile
      args:
        WHISPER_CPP_COMMIT: 927cfce34f31707e17f2bff35c349632fb9e2c3a
    command:
      - whisper-server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - /models/ggml-${WHISPER_MODEL:-small}.bin
    volumes:
      - whisper_models:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      whisper-model:
        condition: service_completed_successfully
    restart: unless-stopped

  wppconnect:
    image: wppconnect/wppconnect-server:2.10.27
    environment:
      PORT: "21465"
      HOST: http://localhost
      SECRET_KEY: ${WPP_API_TOKEN:?set WPP_API_TOKEN in .env}
      WEBHOOK_URL: ""
      TOKEN_STORE_TYPE: file
      CUSTOM_USER_DATA_DIR: /usr/src/wpp-server/userDataDir/
      MANAGER_ENABLED: ${WPP_MANAGER_ENABLED:-false}
      MAX_LISTENERS: "15"
    volumes:
      - wppconnect_tokens:/usr/src/wpp-server/tokens
      - wppconnect_user_data:/usr/src/wpp-server/userDataDir
      - wppconnect_uploads:/usr/src/wpp-server/uploads
      - wppconnect_images:/usr/src/wpp-server/WhatsAppImages
      - wppconnect_logs:/usr/src/wpp-server/log
    ports:
      - "127.0.0.1:21465:21465"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:21465/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  document-parser:
    build: .
    command: ["node", "dist/src/document-parser-main.js"]
    read_only: true
    init: true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      DOCUMENT_PARSER_PORT: "8090"
      DOCUMENT_PARSER_MAX_BYTES: "26214400"
      DOCUMENT_PARSER_TIMEOUT_MS: "15000"
    networks:
      - document_parser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: .
    command: ["node", "dist/scripts/migrate.js"]
    env_file: ${APP_ENV_FILE:-.env}
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-local}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Local}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        node dist/scripts/bootstrap.js           "$$BOOTSTRAP_TENANT_ID"           "$$BOOTSTRAP_TENANT_NAME"           "$$WPP_COLLECTOR_ID"           wppconnect           FREIGHT_INTELLIGENCE
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    read_only: true
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=256m,mode=1777
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - agrolog_export:/data/agrolog-export
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DOCUMENT_PARSER_BASE_URL: http://document-parser:8090
    read_only: true
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=512m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      whisper:
        condition: service_healthy
      wppconnect:
        condition: service_healthy
      document-parser:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    volumes:
      - agrolog_export:/data/agrolog-export
    networks:
      - default
      - document_parser
    restart: unless-stopped

networks:
  document_parser:
    internal: true

volumes:
  postgres_data:
  clamav_data:
  ollama_data:
  whisper_models:
  wppconnect_tokens:
  wppconnect_user_data:
  wppconnect_uploads:
  wppconnect_images:
  wppconnect_logs:
  agrolog_export:

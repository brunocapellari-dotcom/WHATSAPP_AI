name: gcp-production-gate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight = read-only; deploy = build/migrate/deploy/smoke"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      EXPECTED_DEPLOYER_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      BUILD_SERVICE_ACCOUNT: ${{ secrets.GCP_BUILD_SERVICE_ACCOUNT }}
      BUILD_SOURCE_BUCKET: ${{ secrets.GCP_BUILD_SOURCE_BUCKET }}
      WHATSAPP_WORKER_TENANT_ID: ${{ secrets.WHATSAPP_WORKER_TENANT_ID }}
      REGION: southamerica-east1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned

      - name: Validate GitHub secret references
        shell: bash
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          missing=0
          for key in PROJECT_ID EXPECTED_DEPLOYER_SA BUILD_SERVICE_ACCOUNT BUILD_SOURCE_BUCKET WHATSAPP_WORKER_TENANT_ID WIF_PROVIDER; do
            if [ -n "${!key:-}" ]; then
              echo "READY $key"
            else
              echo "MISSING $key"
              missing=1
            fi
          done
          exit "$missing"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3 pinned
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3 pinned
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: "3.12"

      - name: GCP preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/gcp-production
          bash scripts/preflight_gcp.sh | tee outputs/gcp-production/preflight.txt

      - name: Production deploy
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/deploy_gcp.sh | tee outputs/gcp-production/deploy.txt

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: whatsapp-ai-gcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/gcp-production
          if-no-files-found: warn
          retention-days: 14

name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: whatsapp_ai
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d whatsapp_ai"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/whatsapp_ai
      APP_ENCRYPTION_KEY: "01234567890123456789012345678901"
      PII_HMAC_KEY: "01234567890123456789012345678901"
      INTERNAL_API_KEY: test-internal-api-key-123456
      META_VERIFY_TOKEN: test-verify
      META_APP_SECRET: test-app-secret
      META_GRAPH_VERSION: v26.0
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install and generate candidate lockfile
        run: npm install --ignore-scripts
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-lockfile-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate database
        run: npm run db:migrate
      - name: Full regression suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Docker build
        run: docker build -t whatsapp-ai:${{ github.sha }} .

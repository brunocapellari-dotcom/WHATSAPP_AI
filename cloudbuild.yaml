steps:
  - id: lockfile-preflight
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/cloudbuild-artifacts
        if [[ ! -f package-lock.json ]]; then
          echo "package-lock.json missing: generating candidate lockfile for validation and review"
          npm install --package-lock-only --ignore-scripts
          cp package-lock.json /workspace/cloudbuild-artifacts/generated-package-lock.json
          touch /workspace/cloudbuild-artifacts/LOCKFILE_BLOCKER
        fi

  - id: persist-generated-lock
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ -f /workspace/cloudbuild-artifacts/generated-package-lock.json ]]; then
          printf '%s\n' "${COMMIT_SHA}" > /workspace/cloudbuild-artifacts/source-commit.txt
          gcloud storage cp /workspace/cloudbuild-artifacts/generated-package-lock.json \
            /workspace/cloudbuild-artifacts/source-commit.txt \
            "gs://${PROJECT_ID}-ai-execution-evidence/WHATSAPP_AI/${BUILD_ID}/bootstrap/"

          # Deterministic retrieval path: the adoption script only accepts an
          # artifact generated from the exact Git commit currently checked out.
          gcloud storage cp /workspace/cloudbuild-artifacts/generated-package-lock.json \
            /workspace/cloudbuild-artifacts/source-commit.txt \
            "gs://${PROJECT_ID}-ai-execution-evidence/WHATSAPP_AI/bootstrap/by-commit/${COMMIT_SHA}/"
        fi

  - id: deterministic-dependencies
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        npm ci --ignore-scripts
        node --input-type=module <<'NODE'
        import fs from 'node:fs';

        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
        const deps = { ...(pkg.dependencies ?? {}), ...(pkg.devDependencies ?? {}) };
        const allowedRemote = new Map([
          ['xlsx', 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'],
        ]);

        for (const [name, rawSpec] of Object.entries(deps)) {
          const spec = String(rawSpec);
          if (!/^https?:\/\//i.test(spec)) continue;
          if (allowedRemote.get(name) !== spec) {
            throw new Error(`unapproved_remote_dependency:${name}=${spec}`);
          }

          const locked = lock.packages?.[`node_modules/${name}`];
          if (!locked || locked.resolved !== spec || !/^sha512-/.test(String(locked.integrity ?? ''))) {
            throw new Error(`remote_dependency_missing_lock_integrity:${name}`);
          }
        }
        NODE

  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=whatsapp-postgres
      - --network=cloudbuild
      - -e
      - POSTGRES_DB=whatsapp_ai
      - -e
      - POSTGRES_USER=whatsapp_ai
      - -e
      - POSTGRES_PASSWORD=whatsapp-ci
      - postgres:17

  - id: wait-postgres
    name: postgres:17
    entrypoint: bash
    args:
      - -ceu
      - |
        for _ in $(seq 1 60); do
          if pg_isready -h whatsapp-postgres -U whatsapp_ai -d whatsapp_ai >/dev/null 2>&1; then
            exit 0
          fi
          sleep 1
        done
        echo "PostgreSQL did not become ready" >&2
        exit 1

  - id: application-gate
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        export NODE_ENV=test
        export ZERO_COST_MODE=true
        export DATABASE_URL=postgres://whatsapp_ai:whatsapp-ci@whatsapp-postgres:5432/whatsapp_ai
        export APP_ENCRYPTION_KEY="$$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
        export PII_HMAC_KEY="$$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
        export INTERNAL_API_KEY="$$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
        export LOCAL_AI_BASE_URL=http://ollama:11434
        export WHISPER_BASE_URL=http://whisper:8080
        npm run lint
        npm run typecheck
        npm run schema:export
        npm run db:migrate
        npm test
        npm run build
        npm audit --audit-level=high

  - id: container-backup-security
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p /workspace/cloudbuild-artifacts/security
        docker build --pull -t whatsapp-ai:cloudbuild .

        docker exec whatsapp-postgres pg_dump \
          --username=whatsapp_ai --dbname=whatsapp_ai --format=custom \
          --no-owner --no-privileges > /workspace/cloudbuild-artifacts/whatsapp_ai.dump
        test -s /workspace/cloudbuild-artifacts/whatsapp_ai.dump
        sha256sum /workspace/cloudbuild-artifacts/whatsapp_ai.dump \
          > /workspace/cloudbuild-artifacts/whatsapp_ai.dump.sha256

        docker exec whatsapp-postgres createdb --username=whatsapp_ai whatsapp_ai_restore
        cat /workspace/cloudbuild-artifacts/whatsapp_ai.dump | \
          docker exec -i whatsapp-postgres pg_restore \
            --username=whatsapp_ai --dbname=whatsapp_ai_restore \
            --no-owner --no-privileges --exit-on-error

        docker exec whatsapp-postgres psql \
          --username=whatsapp_ai --dbname=whatsapp_ai_restore \
          --set=ON_ERROR_STOP=1 --tuples-only --command="
            SELECT CASE WHEN to_regclass('public.schema_migrations') IS NOT NULL THEN 1 ELSE 0 END;
            SELECT CASE WHEN to_regclass('public.raw_messages') IS NOT NULL THEN 1 ELSE 0 END;
            SELECT CASE WHEN to_regclass('public.freight_events') IS NOT NULL THEN 1 ELSE 0 END;
            SELECT CASE WHEN to_regclass('public.freight_event_revisions') IS NOT NULL THEN 1 ELSE 0 END;
            SELECT CASE WHEN to_regclass('public.business_message_runs') IS NOT NULL THEN 1 ELSE 0 END;
            SELECT CASE WHEN to_regclass('public.webhook_inbox') IS NOT NULL THEN 1 ELSE 0 END;
          " | awk 'NF { if ($$1 != 1) exit 1 }'

        docker run --rm -e SEMGREP_SEND_METRICS=off -v /workspace:/src \
          semgrep/semgrep:1.177.0 \
          semgrep scan --metrics=off --error --config=/src/.semgrep.yml /src/src /src/scripts

        if [[ -d /workspace/.git ]]; then
          docker run --rm -v /workspace:/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --no-banner
        else
          docker run --rm -v /workspace:/repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /repo --redact --no-banner
          printf 'Cloud Build source has no .git directory; full-history Gitleaks remains a release requirement.\n' \
            > /workspace/cloudbuild-artifacts/security/GITLEAKS_HISTORY_LIMITATION.txt
        fi

        docker run --rm -v /workspace:/work -w /work aquasec/trivy:0.74.0 \
          fs --scanners vuln,misconfig --severity HIGH,CRITICAL \
          --exit-code 1 --ignore-unfixed .

        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 \
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
          --ignore-unfixed whatsapp-ai:cloudbuild

        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v /workspace/cloudbuild-artifacts/security:/out aquasec/trivy:0.74.0 \
          image --format cyclonedx --output /out/sbom.cdx.json whatsapp-ai:cloudbuild

        test -s /workspace/cloudbuild-artifacts/security/sbom.cdx.json
        if [[ -f /workspace/cloudbuild-artifacts/LOCKFILE_BLOCKER ]]; then
          printf 'BOOTSTRAP_GATE_OK_LOCKFILE_UNCOMMITTED\n' > /workspace/cloudbuild-gate-summary.txt
        else
          printf 'FULL_PROJECT_GATE_OK\n' > /workspace/cloudbuild-gate-summary.txt
        fi

  - id: persist-evidence
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: bash
    args:
      - -ceu
      - |
        printf '%s\n' "${COMMIT_SHA}" > /workspace/source-commit.txt
        gcloud storage cp /workspace/cloudbuild-gate-summary.txt /workspace/source-commit.txt \
          /workspace/cloudbuild-artifacts/whatsapp_ai.dump.sha256 \
          /workspace/cloudbuild-artifacts/security/sbom.cdx.json \
          "gs://${PROJECT_ID}-ai-execution-evidence/WHATSAPP_AI/${BUILD_ID}/"

        if compgen -G "/workspace/generated-schemas/*.json" > /dev/null; then
          gcloud storage cp /workspace/generated-schemas/*.json \
            "gs://${PROJECT_ID}-ai-execution-evidence/WHATSAPP_AI/${BUILD_ID}/schemas/"
        fi

        if [[ -f /workspace/cloudbuild-artifacts/security/GITLEAKS_HISTORY_LIMITATION.txt ]]; then
          gcloud storage cp /workspace/cloudbuild-artifacts/security/GITLEAKS_HISTORY_LIMITATION.txt \
            "gs://${PROJECT_ID}-ai-execution-evidence/WHATSAPP_AI/${BUILD_ID}/security/"
        fi

  - id: release-decision
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ -f /workspace/cloudbuild-artifacts/LOCKFILE_BLOCKER ]]; then
          echo "BLOCKED: the complete bootstrap gate ran with a generated package-lock.json."
          echo "Commit the exact stored lockfile and rerun this same commit gate before release."
          exit 42
        fi
        if [[ -f /workspace/cloudbuild-artifacts/security/GITLEAKS_HISTORY_LIMITATION.txt ]]; then
          echo "BLOCKED: working-tree secret scan passed, but full Git history was not available."
          exit 43
        fi
        echo "Cloud Build release decision: PASS"

timeout: 7200s
serviceAccount: "projects/${PROJECT_ID}/serviceAccounts/ai-build-executor@${PROJECT_ID}.iam.gserviceaccount.com"
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

name: Release Gate
on:
  workflow_dispatch:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-project:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - name: Checkout full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify local toolchain
        run: |
          node --version
          npm --version
          docker --version
          docker compose version
      - name: Complete release gate
        run: bash scripts/release-gate.sh
